[project]
name = "generals-bots"
version = "2.6.0"
description = "Coworld Classic policy training with native PufferLib and a vectorized JAX game engine"
authors = [{name = "Matej Straka", email = "strakammm@gmail.com"}]
license = {text = "MIT"}
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "numpy>=2.0.0",
    "pygame>=2.6.0",
    "python-socketio[client]>=5.11.4",
    "jax>=0.4.30",
    "jaxlib>=0.4.30",
]

[project.optional-dependencies]
train = [
    "pydantic==2.13.5",
    "msgpack==1.1.2",
]
softmax = [
    "fastapi==0.135.1",
    "pydantic==2.13.5",
    "uvicorn==0.41.0",
    "websockets==16.0",
    "httpx==0.28.1",
]
dev = [
    "pytest>=8.0.0",
]

[project.urls]
Homepage = "https://generals.bot"
Repository = "https://github.com/relh/generals-bots"
Upstream = "https://github.com/strakam/generals-bots"

[project.scripts]
generals-policy = "integrations.policy:main"

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["generals*", "integrations*"]

[tool.setuptools.package-data]
integrations = ["policy_baseline.json", "spatial_context_muon*.json", "*.cuh", "native/*.cpp"]

[tool.ruff]
line-length = 120
lint.select = ["E", "F", "I", "BLE", "UP", "FA"]
target-version = "py311"
exclude = ["tests", "examples"]
